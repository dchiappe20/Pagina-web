<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Dejar de recibir correos</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237C5CFF'/%3E%3Cstop offset='1' stop-color='%2300E5A0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M47 31 31 50M31 31l16 19' stroke-width='5'/%3E%3Cpath d='M19 17v21h20' stroke-width='6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root{ --bg:#0A0E1C; --card:#121A30; --bd:rgba(255,255,255,.09); --tx:#F2F5FF; --txd:#8B96B8; --acc:#7C5CFF; --acc2:#00E5A0; --err:#FF6B7A; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif; color:var(--tx);
    background:
      radial-gradient(900px 520px at 85% -10%, rgba(124,92,255,.22), transparent 60%),
      radial-gradient(800px 480px at 5% 110%, rgba(0,229,160,.14), transparent 60%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; padding:24px 18px;
    -webkit-font-smoothing:antialiased;
  }
  .tarjeta{ width:100%; max-width:420px; background:var(--card); border:1px solid var(--bd); border-radius:24px; padding:28px 24px; text-align:center; }
  .logo{ width:64px; height:64px; border-radius:20px; margin:0 auto 18px; background:linear-gradient(135deg,var(--acc),var(--acc2)); display:flex; align-items:center; justify-content:center; }
  h1{ font-size:21px; margin:0; letter-spacing:-.3px; }
  p{ font-size:14px; line-height:1.55; color:var(--txd); margin:10px 0 0; }
  b{ color:var(--tx); }
  button{
    display:block; width:100%; margin-top:22px; padding:15px; border:0; border-radius:14px; font-size:15px; font-weight:700;
    color:#fff; background:linear-gradient(135deg,var(--acc),var(--acc2)); cursor:pointer; font-family:inherit;
  }
  button:disabled{ opacity:.6; cursor:default; }
  .error{ color:var(--err); }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
  <main class="tarjeta">
    <div class="logo" aria-hidden="true">
      <svg width="38" height="32" viewBox="0 0 58 48" fill="none"><path d="M50 23 30 47M30 23l20 24" stroke="#fff" stroke-width="6" stroke-linecap="round"/><path d="M16 9v26h24" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div id="cargando">
      <h1>Un momento…</h1>
    </div>

    <div id="preguntar" hidden>
      <h1>¿Dejar de recibir estos correos?</h1>
      <p>No te llegarán más envíos de <b id="empresa"></b> desde Leadyx.</p>
      <button id="confirmar" type="button">Sí, no quiero recibir más</button>
    </div>

    <div id="listo" hidden>
      <h1>Listo</h1>
      <p>No recibirás más envíos de <b id="empresa2"></b> desde Leadyx.</p>
    </div>

    <div id="invalido" hidden>
      <h1>Este enlace no sirve</h1>
      <p>Puede que esté incompleto. Ábrelo de nuevo desde el correo que recibiste.</p>
    </div>

    <p id="fallo" class="error" hidden>No se pudo completar. Inténtalo de nuevo en un rato.</p>
  </main>

<script>
  // La función de Supabase hace el trabajo; esta página sólo pregunta antes,
  // para que un antivirus que abre el enlace solo no dé de baja a nadie.
  var FUNCION = 'https://tbvqpsearfgazjnqvrng.supabase.co/functions/v1/baja-correo';
  var token = new URLSearchParams(location.search).get('t') || '';
  var ver = function (id) {
    ['cargando', 'preguntar', 'listo', 'invalido'].forEach(function (x) {
      document.getElementById(x).hidden = x !== id;
    });
  };
  var pedir = function (accion) {
    return fetch(FUNCION, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: token, accion: accion })
    }).then(function (r) { return r.json(); });
  };

  if (!/^[0-9a-f-]{36}$/i.test(token)) {
    ver('invalido');
  } else {
    pedir('ver').then(function (r) {
      if (!r || !r.ok) { ver('invalido'); return; }
      document.getElementById('empresa').textContent = r.empresa || 'esta empresa';
      document.getElementById('empresa2').textContent = r.empresa || 'esta empresa';
      ver(r.baja ? 'listo' : 'preguntar');
    }).catch(function () {
      ver('preguntar');
      document.getElementById('empresa').textContent = 'esta empresa';
      document.getElementById('empresa2').textContent = 'esta empresa';
    });
  }

  document.getElementById('confirmar').addEventListener('click', function () {
    var boton = this;
    boton.disabled = true;
    document.getElementById('fallo').hidden = true;
    pedir('baja').then(function (r) {
      if (r && r.ok && r.baja) { ver('listo'); return; }
      throw new Error('sin baja');
    }).catch(function () {
      boton.disabled = false;
      document.getElementById('fallo').hidden = false;
    });
  });
</script>
</body>
</html>
